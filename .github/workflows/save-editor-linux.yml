# Fork only, never for the upstream pull request: a Linux (Steam Deck) test build of the launcher with the Save Editor and its data
# tool. Runs on a push to save-editor-linux. Same AppImage build as release.yml's linux-launcher job, plus
# launcher/scripts/build-pokohex.sh (the editor, and pokohex-extract for tools/pokohex). Packed as a .tar.gz so the AppImage and the
# tool keep their executable bit (an Actions artifact drops it).
name: Save editor Linux

on:
  push:
    branches: [save-editor-linux]

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VERSION: 0.13.1   # the installed release this build is tested in, so it does not offer that release as an update
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            file g++ pkg-config

      - name: Save editor (PokoHex) and its data tool
        run: sh launcher/scripts/build-pokohex.sh --extractor linux-x64 out/tools/pokohex

      - name: Launcher (AppImage)
        working-directory: launcher
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
        run: |
          sed -i -E "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i -E "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          npm ci --no-audit --no-fund
          for try in 1 2 3; do
            if npm run tauri build -- --bundles appimage --config '{"bundle":{"active":true}}'; then break; fi
            [ "$try" = 3 ] && { echo "::error::the AppImage could not be bundled after 3 tries"; exit 1; }
            rm -rf src-tauri/target/release/bundle/appimage
            sleep 30
          done

      - name: AppImage runtime without FUSE 2
        env:
          RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          curl -fsSL --retry 3 -o runtime-x86_64 "$RUNTIME_URL"
          echo "$RUNTIME_SHA256  runtime-x86_64" | sha256sum -c -
          ai=$(ls launcher/src-tauri/target/release/bundle/appimage/*.AppImage)
          off=$(APPIMAGE_EXTRACT_AND_RUN=1 "$ai" --appimage-offset)
          { cat runtime-x86_64; tail -c +$((off + 1)) "$ai"; } > out/PokopiaLauncher.AppImage
          chmod 755 out/PokopiaLauncher.AppImage out/tools/pokohex/pokohex-extract

      - name: Data tool works
        run: |
          if ./out/tools/pokohex/pokohex-extract --check nowhere; then exit 1; fi
          said=$(./out/tools/pokohex/pokohex-extract /nowhere /tmp/pokohex-test || true)
          echo "$said"
          echo "$said" | grep -q '^@error '

      - name: Pack
        run: tar -czf PokopiaLauncher-save-editor-linux-${VERSION}.tar.gz -C out PokopiaLauncher.AppImage tools

      - uses: actions/upload-artifact@v4
        with:
          name: PokopiaLauncher-save-editor-linux-0.13.1
          path: PokopiaLauncher-save-editor-linux-*.tar.gz
          compression-level: 0
