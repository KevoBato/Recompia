# The launcher with the Save Editor page, as a drop-in PokopiaLauncher.AppImage for an existing Linux install. Run by hand
# (Actions > Save editor AppImage > Run workflow). Same build as release.yml's linux-launcher job, plus the save editor
# (launcher/scripts/build-pokohex.sh). PokoHex is built into the launcher, so the AppImage is the only file that changes.
name: Save editor AppImage

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version the launcher reports (match the installed release, so it does not offer that release as an update)
        default: 0.13.1
        required: true

jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            file g++ pkg-config

      - name: Save editor (PokoHex)
        run: sh launcher/scripts/build-pokohex.sh

      - name: Launcher (AppImage)
        working-directory: launcher
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
        run: |
          sed -i -E "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i -E "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          npm ci --no-audit --no-fund
          (cd src-tauri && cargo test --quiet saveedit)
          for try in 1 2 3; do
            if npm run tauri build -- --bundles appimage --config '{"bundle":{"active":true}}'; then break; fi
            [ "$try" = 3 ] && { echo "::error::the AppImage could not be bundled after 3 tries"; exit 1; }
            rm -rf src-tauri/target/release/bundle/appimage
            sleep 30
          done

      - name: AppImage runtime without FUSE 2
        env:
          RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          curl -fsSL --retry 3 -o runtime-x86_64 "$RUNTIME_URL"
          echo "$RUNTIME_SHA256  runtime-x86_64" | sha256sum -c -
          ai=$(ls launcher/src-tauri/target/release/bundle/appimage/*.AppImage)
          off=$(APPIMAGE_EXTRACT_AND_RUN=1 "$ai" --appimage-offset)
          mkdir -p out
          { cat runtime-x86_64; tail -c +$((off + 1)) "$ai"; } > out/PokopiaLauncher.AppImage
          chmod 755 out/PokopiaLauncher.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: PokopiaLauncher-save-editor-${{ inputs.version }}
          path: out/PokopiaLauncher.AppImage
